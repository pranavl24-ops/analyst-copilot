# Valuation profile for industrial / non-financial companies.
# Drives model selection and default assumptions for the FCFF pipeline.

name: industrial
valuation_model: fcff

assumptions:
  forecast_years: 5
  terminal_growth: 0.055
  tax_rate: 0.21
  rf: 0.07
  erp: 0.055
  default_beta: 1.0
  cost_of_debt: 0.08

comps:
  multiples:
    - ev_ebitda
    - ev_sales
    - pe
